# Exported by Render Blueprint
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: jurisly-db
    plan: free
    databaseName: jurisly
    user: jurisly

services:
  - type: web
    name: jurisly
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: jurisly-db
          property: connectionString
      - key: DJEN_BASE_URL
        value: "https://comunicaapi.pje.jus.br"
      - key: DJEN_TIMEOUT
        value: "30"
      - key: DJEN_MAX_RETRIES
        value: "2"
      - key: DJEN_ITENS_POR_PAGINA
        value: "20"
      - key: DJEN_DIAS_SINCRONIZACAO
        value: "7"
      - key: SEED_DEMO
        value: "1"
      - key: PORT
        value: "8000"
