{% if messages %}
  <div class="space-y-2 mb-5" role="status" aria-live="polite">
    {% for message in messages %}
      <div class="rounded-xl border px-4 py-3 text-sm
        {% if message.tags == 'error' %}border-red-400/40 bg-red-500/10 text-red-100
        {% elif message.tags == 'success' %}border-emerald-400/30 bg-emerald-500/10 text-emerald-100
        {% else %}border-jurisly-gold-200/30 bg-jurisly-gold-500/10 text-jurisly-gold-50{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
