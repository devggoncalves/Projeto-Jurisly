<button type="{{ tipo|default:'submit' }}" class="botao-ouro {{ classes }}" {% if disabled %}disabled{% endif %} data-loading-button>
  <span class="botao-ouro__texto">{{ rotulo }}</span>
  <span class="botao-ouro__seta" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/></svg>
  </span>
  <span class="botao-ouro__loading hidden" aria-hidden="true">
    <svg class="h-5 w-5 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>
  </span>
</button>
