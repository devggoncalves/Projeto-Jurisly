{% extends "base/base.html" %}

{% block title %}Instruções enviadas · Jurisly{% endblock %}

{% block body %}
<div class="auth-simple">
  <div class="login-card max-w-md w-full text-center">
    <h1 class="font-display text-3xl text-jurisly-gold-100">Verifique seu e-mail</h1>
    <p class="mt-3 text-sm text-jurisly-muted">
      Se existir uma conta associada a este e-mail, enviaremos as instruções de recuperação.
    </p>
    <p class="mt-8">
      <a href="{% url 'contas:login' %}" class="text-jurisly-gold-100 hover:text-jurisly-gold-50 text-sm">Voltar ao login</a>
    </p>
  </div>
</div>
{% endblock %}
