[project]
name = "jurisly"
version = "0.1.0"
description = "Plataforma SaaS para advogados e escritórios de advocacia"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2.9,<5.3",
    "djangorestframework>=3.15,<4",
    "django-environ>=0.11,<1",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23.0,<24",
    "whitenoise>=6.8,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.9,<1",
    "black>=25.1,<26",
    "pre-commit>=4.1,<5",
    "factory-boy>=3.3,<4",
]

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "venv",
    "**/migrations/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N801", "N802", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]
"**/tests/**" = ["N802"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers --reuse-db"
testpaths = ["tests", "apps"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
