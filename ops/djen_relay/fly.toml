# Relay DJEN — região São Paulo (IP BR para o CloudFront do CNJ)
app = "jurisly-djen-relay"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  RELAY_HOST = "0.0.0.0"
  RELAY_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
