# Jurisly — Fly.io São Paulo (IP BR para DJEN/CNJ)
app = "jurisly-app"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  DEBUG = "False"
  SEED_DEMO = "1"
  RUN_MIGRATE = "1"
  RUN_COLLECTSTATIC = "1"
  DJEN_BASE_URL = "https://comunicaapi.pje.jus.br"
  DJEN_TIMEOUT = "30"
  DJEN_MAX_RETRIES = "2"
  DJEN_ITENS_POR_PAGINA = "20"
  DJEN_DIAS_SINCRONIZACAO = "7"
  SECURE_SSL_REDIRECT = "True"
  SESSION_COOKIE_SECURE = "True"
  CSRF_COOKIE_SECURE = "True"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
