# Produção single-node (Oracle Always Free / VPS Brasil)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jurisly
      POSTGRES_USER: jurisly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jurisly-troque-isto}
    volumes:
      - jurisly_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurisly -d jurisly"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://jurisly:${POSTGRES_PASSWORD:-jurisly-troque-isto}@db:5432/jurisly
      SEED_DEMO: "1"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
      DJEN_BASE_URL: https://comunicaapi.pje.jus.br
      DJEN_TIMEOUT: "30"
      DJEN_MAX_RETRIES: "2"
      DJEN_ITENS_POR_PAGINA: "20"
      DJEN_DIAS_SINCRONIZACAO: "7"
      PORT: "8000"

volumes:
  jurisly_pg:
